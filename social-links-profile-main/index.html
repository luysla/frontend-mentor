<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Frontend Mentor | Social links profile</title>
  </head>

  <body>
    <main>
      <div class="card">
        <div class="card__header">
          <img class="card__avatar" src="./assets/images/avatar-jessica.jpeg" alt="User profile photo" width="150" height="100">
          <div class="card__user-info">
            <h1 class="card__username">Jessica Randall</h1>
            <p class="card__location">London, United Kingdom</p>
          </div>
          <p class="card__description">"Front-end developer and avid reader."</p>
        </div>

        <ul class="card__links">
          <li class="card__link"><a href="#">GitHub</a></li>
          <li class="card__link"><a href="#">Frontend Mentor</a></li>
          <li class="card__link"><a href="#">LinkedIn</a></li>
          <li class="card__link"><a href="#">Twitter</a></li>
          <li class="card__link"><a href="#">Instagram</a></li>
        </ul>

      </div>
    </main>
  </body>

</html>
